services:
  db:
    image: postgres:15.10-alpine
    container_name: sciem_db
    env_file: .env
    volumes:
      - ./data/pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./api
    container_name: sciem_api
    working_dir: /var/www
    volumes:
      - ./api:/var/www
    ports:
      - "8200:80"
    depends_on:
      - db

  gui:
    image: node:20-alpine
    container_name: sciem_gui
    working_dir: /app
    volumes:
      - ./gui:/app
      - /app/node_modules
    ports:
      - "4173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api